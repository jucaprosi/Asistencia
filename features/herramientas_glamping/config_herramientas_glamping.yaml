# ¤herramientas-mcp
transporte: ${MCP_TRANSPORTE:-stdio}     # stdio | http
puerto: 8090                             # solo en agent-net
timeout_por_herramienta_s: 8
herramientas:
  - {nombre: consultar_disponibilidad, esquema: esquemas/consultar_disponibilidad.json, roles: [huesped], sala_destino: pms_conector, habilitada: false}
  - {nombre: cotizar, esquema: esquemas/cotizar.json, roles: [huesped], sala_destino: pms_conector, habilitada: false}
