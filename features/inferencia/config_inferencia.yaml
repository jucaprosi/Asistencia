# ADR-0021: lista blanca, región→ubicación y precios viven solo aquí. Sin valores por defecto de proyecto ni región.
modelos_permitidos:
  principal: gemini-3.8-flash
  economico: gemini-3.5-flash-lite
ubicaciones:
  us: { pais: Estados Unidos, endpoint: aiplatform.us.rep.googleapis.com }
# USD por 1M tokens (entrada, salida); tarifa vigente desde 2027-01-01 para no subestimar RNF-16.
precios_por_millon:
  gemini-3.8-flash: ["1.50", "7.50"]
  gemini-3.5-flash-lite: ["0.30", "2.50"]
# Salida máxima por llamada: se envía al proveedor y se reserva en el tope diario (C3).
max_output_tokens: 2048
# Un único reintento ante 5xx o 429 dentro del plazo del turno; espera de 0,5x a 1,5x la base (T-409), o
# Retry-After si es mayor. Si la espera supera espera_maxima_s, o no deja la base para la segunda llamada, no hay reintento.
reintentos: 1
espera_reintento_s: 1.0
espera_maxima_s: 5.0
