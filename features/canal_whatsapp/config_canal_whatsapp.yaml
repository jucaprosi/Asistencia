# ¤canal-whatsapp
numero_id: ${META_PHONE_NUMBER_ID:-}
cuenta_negocio_id: ${META_WABA_ID:-}
token_acceso: ${META_ACCESS_TOKEN:-}
verify_token: ${META_VERIFY_TOKEN:-}
secreto_app: ${META_APP_SECRET:-}
version_api: v21.0
reintentos:
  max: 3
  backoff_s: [1, 4, 10]
ventana_servicio_horas: 24
plantillas:
  - {nombre: instrucciones_checkin, idioma: es, categoria: utility, variables: [nombre, propiedad, hora], aprobada: false}
  - {nombre: recordatorio_llegada, idioma: es, categoria: utility, variables: [nombre, propiedad, fecha], aprobada: false}
  - {nombre: comision_validada, idioma: es, categoria: utility, variables: [nombre, ticket, comision], aprobada: false}
  - {nombre: venta_rechazada, idioma: es, categoria: utility, variables: [nombre, ticket, motivo], aprobada: false}
  - {nombre: incidencia_actualizada, idioma: es, categoria: utility, variables: [nombre, incidencia, estado], aprobada: false}
  - {nombre: handoff_asignado, idioma: es, categoria: utility, variables: [gestor, propiedad, motivo], aprobada: false}
  - {nombre: seguimiento_atencion, idioma: es, categoria: utility, variables: [nombre, propiedad], aprobada: false}
  - {nombre: solicitud_reserva_anfitrion, idioma: es, categoria: utility, variables: [anfitrion, propiedad, fechas, solicitud], aprobada: false}
  - {nombre: reserva_confirmada, idioma: es, categoria: utility, variables: [nombre, propiedad, contacto], aprobada: false}
  - {nombre: estado_cuenta_anfitrion, idioma: es, categoria: utility, variables: [anfitrion, periodo, total], aprobada: false}
  - {nombre: codigo_acceso_panel, idioma: es, categoria: authentication, variables: [codigo], aprobada: false}
ingesta:
  reintentos_evento: 5
  agrupacion_segundos: 3
canal_vendedores:
  modo: ${CANAL_VENDEDORES_MODO:-uno_a_uno}   # grupo | uno_a_uno (se fija al validar S-01 en TASK-001)
  grupo_id: ${CANAL_VENDEDORES_GRUPO_ID:-}
medios:
  bucket: ${S3_BUCKET:-glamping-medios}
  prefijo: whatsapp/
  max_mb: 16
audio:
  transcribir: false   # decisión menor de TASK-001
