name: arnes

on:
  push:
  pull_request:

jobs:
  arnes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Arnés físico (UTF-8, secretos, pytest, evaluaciones, compose)
        run: bash ejecutar_arnes_glamping.sh

      - name: Aplicar y verificar el esquema canónico en PostgreSQL real
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f docs/spec/esquema.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f docs/spec/verificacion_esquema.sql

      - name: Publicar certificado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test_verdict
          path: governance/artefactos/data/
