name: arnes

on:
  push:
  pull_request:

jobs:
  arnes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Arnés físico (UTF-8, secretos, pytest, evaluaciones, compose)
        run: bash ejecutar_arnes_glamping.sh

      - name: Validar compose con docker
        run: cp .env.example .env && docker compose -f compose.yaml -f compose.production.yaml config -q

      - name: Publicar certificado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test_verdict
          path: governance/artefactos/data/
