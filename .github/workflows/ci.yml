name: arnes

on:
  push:
  pull_request:

jobs:
  arnes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Historial completo: el árbitro de migraciones (ADR-0023) compara contra origin/main.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Primero y sin dependencias: falla rápido. Base = rama destino del PR; en push a main, el commit
      # anterior (si no, origin/main == HEAD y no compararía nada). Sin base, falla (--exigir-base).
      - name: Árbitro de migraciones (ADR-0023)
        env:
          EVENTO: ${{ github.event_name }}
          RAMA_DESTINO: ${{ github.base_ref }}
          ANTERIOR: ${{ github.event.before }}
          REF: ${{ github.ref }}
        run: |
          if [ "$EVENTO" = "pull_request" ]; then BASE="origin/$RAMA_DESTINO"
          elif [ "$REF" = "refs/heads/main" ] && [ -n "$ANTERIOR" ] && [ "$ANTERIOR" != "0000000000000000000000000000000000000000" ]; then BASE="$ANTERIOR"
          else BASE="origin/main"; fi
          python scripts/verificar_migraciones.py --base "$BASE" --exigir-base

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m playwright install chromium --with-deps

      - name: Arnés físico (UTF-8, secretos, pytest, evaluaciones, compose)
        run: bash ejecutar_arnes_glamping.sh

      - name: Prueba de aislamiento de red INV_RED_AISLADA (RNF-10)
        run: pytest tests/integracion/carga/test_aislamiento_red.py -v

      - name: Prueba de carga concurrente y latencia (RNF-06, RNF-01)
        run: pytest tests/integracion/carga/test_carga_concurrente.py -v

      - name: Sondeo de salud y disponibilidad (RNF-05)
        run: pytest tests/integracion/carga/test_sondeo_salud.py -v

      - name: Aplicar migraciones y verificar el esquema en PostgreSQL real (ADR-0023)
        run: |
          python scripts/migrar_db.py --url postgresql://postgres@localhost:5432/postgres
          python scripts/migrar_db.py --url postgresql://postgres@localhost:5432/postgres
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f docs/spec/verificacion_esquema.sql

      - name: Publicar certificado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test_verdict
          path: governance/artefactos/data/

      - name: Alerta al canal del administrador en caso de fallo (RF-OBS-04)
        if: failure()
        run: |
          python -c "from features.observabilidad.observabilidad_service import ObservabilidadService, cargar_config; obs = ObservabilidadService(cargar_config()); obs.log('ERROR', 'alerta_ci_fallo_arnes', pipeline='github-actions', canal='admin')"

  playwright-panel:
    name: Playwright Panel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: features/panel_operativo/ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias de Python
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: features/panel_operativo/ui/package-lock.json

      - name: Instalar dependencias de Node
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Arnés Playwright del panel
        env:
          CI: "true"
        run: npx playwright test

      - name: Publicar reporte y resultados
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-panel
          path: |
            features/panel_operativo/ui/playwright-report/
            features/panel_operativo/ui/test-results/
          retention-days: 7
