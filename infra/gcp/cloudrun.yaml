# ¤infra-cloud
# Manifest declarativo de Google Cloud Run para Glamping Imbabura Agent & Panel Operativo.
# Conexión persistente a Cloud SQL PostgreSQL 16 con pgvector mediante socket UNIX.
# Cumple ADR-0019 y APORTES_INEDITOS.md (min-instances: 1 para latencia WhatsApp < 50ms).
# © 2026 Juan Carlos Proaño. Todos los derechos reservados.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: glamping-service
  labels:
    cloud.googleapis.com/location: ${GCP_LOCATION:-us-central1}
    app.kubernetes.io/name: glamping-imbabura
  annotations:
    run.googleapis.com/launch-stage: GA
    run.googleapis.com/ingress: all
    run.googleapis.com/description: "Glamping Imbabura Asistente y Panel Operativo"
spec:
  template:
    metadata:
      annotations:
        # Enlace nativo a Cloud SQL (Auth Proxy gestionado por Cloud Run)
        run.googleapis.com/cloudsql-instances: ${GCP_PROJECT_ID:-glamping-imbabura}:${GCP_LOCATION:-us-central1}:glamping-db
        # Garantía anti arranques en frío (Cold Starts) para WhatsApp Webhook
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "5"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cpu-throttling: "false"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: sa-cloud-run@${GCP_PROJECT_ID:-glamping-imbabura}.iam.gserviceaccount.com
      containers:
        - image: ${GCP_LOCATION:-us-central1}-docker.pkg.dev/${GCP_PROJECT_ID:-glamping-imbabura}/glamping-imbabura-repo/glamping-app:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1000m"
              memory: "512Mi"
          env:
            - name: APP_ENV
              value: "produccion"
            - name: LOG_NIVEL
              value: "INFO"
            # Inferencia (ADR-0021): Vertex multirregión us por ADC; los modelos viven en la sala inferencia.
            - name: GOOGLE_CLOUD_PROJECT
              value: "${GCP_PROJECT_ID:-glamping-imbabura}"
            - name: VERTEX_LOCATION
              value: "us"
            # Conexión persistente PostgreSQL mediante Socket UNIX de Cloud SQL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: DATABASE_URL
                  key: latest
            - name: PII_VAULT_KEY
              valueFrom:
                secretKeyRef:
                  name: PII_VAULT_KEY
                  key: latest
            - name: META_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: META_ACCESS_TOKEN
                  key: latest
            - name: META_VERIFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: META_VERIFY_TOKEN
                  key: latest
            - name: META_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: META_APP_SECRET
                  key: latest
            - name: PANEL_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: PANEL_SESSION_SECRET
                  key: latest
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
