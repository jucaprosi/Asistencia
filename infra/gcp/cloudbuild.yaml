# ¤infra-cloud
# Pipeline de CI/CD en Google Cloud Build
# Compila contenedor, ejecuta migraciones idempotentes de PostgreSQL y despliega en Cloud Run
# © 2026 Juan Carlos Proaño. Todos los derechos reservados.
steps:
  # 1. Compilar imagen OCI
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/glamping-imbabura-repo/glamping-app:$COMMIT_SHA'
      - '-t'
      - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/glamping-imbabura-repo/glamping-app:latest'
      - '.'

  # 2. Publicar imagen en Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/glamping-imbabura-repo/glamping-app'

  # 3. Aplicar migraciones canónicas de esquema en PostgreSQL (Cloud SQL)
  - name: '$_LOCATION-docker.pkg.dev/$PROJECT_ID/glamping-imbabura-repo/glamping-app:$COMMIT_SHA'
    entrypoint: 'python'
    args:
      - 'scripts/migrar_db.py'
    secretEnv: ['DATABASE_URL']

  # 4. Desplegar en Google Cloud Run con min-instances: 1 y Cloud SQL adjunto
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'glamping-service'
      - '--image=$_LOCATION-docker.pkg.dev/$PROJECT_ID/glamping-imbabura-repo/glamping-app:$COMMIT_SHA'
      - '--region=$_LOCATION'
      - '--min-instances=1'
      - '--max-instances=5'
      - '--add-cloudsql-instances=$PROJECT_ID:$_LOCATION:glamping-db'
      - '--update-secrets=DATABASE_URL=DATABASE_URL:latest,PII_VAULT_KEY=PII_VAULT_KEY:latest'
      - '--update-env-vars=APP_ENV=produccion'
      - '--allow-unauthenticated'

substitutions:
  _LOCATION: 'us-central1'

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/DATABASE_URL/versions/latest
      env: 'DATABASE_URL'

images:
  - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/glamping-imbabura-repo/glamping-app:$COMMIT_SHA'
  - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/glamping-imbabura-repo/glamping-app:latest'
