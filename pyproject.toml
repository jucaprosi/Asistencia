[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "glamping-imbabura-agent"
version = "0.1.0"
description = "Asistente de WhatsApp con Claude, ARM de ventas y panel operativo para Glamping Imbabura (ADPA/ZERAG)"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "COPYRIGHT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.0",
  "pytest>=8",
  "pytest-cov>=5",
]

[tool.setuptools.packages.find]
include = ["app_core*", "features*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
