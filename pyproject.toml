[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "glamping-imbabura-agent"
version = "0.1.0"
description = "Asistente de WhatsApp con Claude, ARM de ventas y panel operativo para Glamping Imbabura (ADPA/ZERAG)"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "COPYRIGHT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "jinja2>=3.1",
  "psycopg[binary]>=3.1",
  "cryptography>=42",
  "python-multipart>=0.0.9",
  "jsonschema>=4.0",  # comisiones valida la exportación en tiempo de ejecución
  # ADR-0021: SDK de Vertex AI, solo lo importa la sala inferencia; fijado y con hash en requirements.lock.
  "google-genai==2.34.0",
  # Día de la cuota (America/Los_Angeles, ADR-0021 enmienda 1): la base de zonas viaja con la app (r5).
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "playwright>=1.40",
]

[tool.setuptools.packages.find]
include = ["app_core*", "features*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
